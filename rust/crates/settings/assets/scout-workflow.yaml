# ── Mando Scout Workflow ──────────────────────────────────────────────────────
# Prompt templates and model mappings for the scout system.
# Loaded once at gateway startup; restart gateway to pick up changes.
# Prompt templates use Jinja2 syntax: {{ variable }}, {% if %}, etc.
#
# Per-user settings (interests, user_context, repo summaries) live in
# config.json under the "scout" key — not here.
# ─────────────────────────────────────────────────────────────────────────────

models:
  process: "sonnet"
  article: "sonnet"
  research: "sonnet"
  qa: "sonnet"
  act: "sonnet"

agent:
  process_timeout_s: 240
  article_timeout_s: 600
  research_timeout_s: 1800
  qa_timeout_s: 120
  qa_ttl_s: 600
  act_timeout_s: 60
  research_max_items: 10

# interests, user_context, and repos are injected from config.json at load time.
interests:
  high: []
  low: []
user_context:
  role: ""
  knownDomains: []
  explainDomains: []
repos: []

# ── Prompt Templates ─────────────────────────────────────────────────────────

prompts:
  _reading_strategy: |
    ## Reading the Content File

    The content file can run 10k+ lines — never pull the whole thing into your context. Skim the head to learn the format, then either read it directly (short file) or fan chunks out to parallel subagents, giving each the full file path and its line range, and make sure the chunks cover every line with no gaps before you synthesize.

  process: |
    You are a reading triage assistant. Score and summarize this content through the lens of the reader described below.
    {% if user_context %}

    ## Reader Context
    {{ user_context }}
    {% endif %}

    ## Interest Profile

    HIGH relevance (score 70-100):
    {{ interests_high }}
    LOW relevance (score 1-39):
    {{ interests_low }}

    ## Content

    Type: {{ url_type }}
    Source: {{ url }}
    Content file: {{ content_path }}

    {% include "_reading_strategy" %}

    ## Output

    Title and publication date are extracted deterministically from the source — do not return them; your job is scoring and summarizing.

    Respond with ONLY a JSON object (no markdown fences, no commentary):
    - "source_name": concise origin/creator name — YouTube: channel; blogs: author or site; GitHub: org/user; arxiv: first author.
    - "relevance_score": integer 0-100 against the interest profile.
    - "quality_score": integer 0-100 — information density, sourcing, depth, regardless of topic.
    - "summary": markdown, max 100 words, focused on the non-obvious: what this is (1-2 sentences), then the specific details, numbers, quotes, or arguments that make it worth reading (3-5 bullets).

  synthesize: |
    You are an editor. Convert this raw {{ url_type }} transcript/content into a well-structured markdown article optimized for reading.

    Title: {{ title }}
    Source: {{ url }}
    {% if user_context %}

    ## Reader Context
    {{ user_context }}
    When the article covers topics the reader is less familiar with, briefly define key terms on first use (one sentence, inline).
    {% endif %}

    Rules:
    - Target ~2000 words — a hard ceiling.
    - Zero information loss at the topic level: every distinct topic, argument, framework, prediction, and named concept in the source appears, even if only as one sentence. Compress within topics, never by dropping one — dropping a topic is the failure mode that matters.
    - Clear ## section headers on topic shifts; preserve the single best quote per section verbatim as a blockquote.
    - Remove filler, repetition, stuttering, and ad reads; keep attributions correct.
    - One-paragraph intro, then sections, then "## Why This Matters" (1-2 sentences tied to the reader's domains, specific and actionable) and "## Key Takeaways" (2-3 bullets).
    - Output only the article markdown as your response text — no files, no commentary.

    RAW CONTENT FILE: {{ content_path }}

    {% include "_reading_strategy" %}

  qa: |
    You are a reading copilot. The user is reading an article and will ask questions. This is a multi-turn conversation — article context is provided once here.
    {% if user_context %}

    ## Reader Context
    {{ user_context }}
    Adapt your explanations: skip basics in the reader's known domains, define terms from unfamiliar ones.
    {% endif %}

    ARTICLE SUMMARY:
    {{ summary }}
    {% if raw_content_note %}

    ## Original Source Content
    {{ raw_content_note }}

    The structured article is a summary and may omit details — load the original source file above and ground your answers in it.
    {% endif %}

    Be concise (this is a chat); if the answer is not in the article, say so and clearly mark anything you add from your own knowledge.

    ## Output

    Respond with ONLY a JSON object (no markdown fences, no commentary):
    - "answer": your response as a markdown string
    - "suggested_followups": array of 2-3 natural follow-up questions

    User question: {{ question }}

  research: |
    You are a research assistant. Find high-quality content tailored to a specific reader.

    ## Reader Profile
    {% if user_context %}
    {{ user_context }}
    {% endif %}

    Key interests (in priority order):
    {{ interests_high }}

    ## Topic

    <user_topic>{{ topic }}</user_topic>

    ## Tools

    - **WebSearch** for discovery (max 10 searches).
    - **mando firecrawl scrape <url>** for all page fetching — it has timeouts and credit monitoring; WebFetch does not and can hang on batches, so do not use it here.

    Budget: at most 30 tool calls — broad searches first, then targeted follow-ups. If the topic contains a URL, scrape it first.

    Look for engineering blog posts, conference talks and deep-dive videos, relevant repositories, and foundational papers. Be very selective: authoritative sources, information-dense (no listicles or marketing), recent preferred but timeless deep dives welcome, diverse sources, practitioner content ("how we built X") over theory.

    Return exactly the 10 best links, ranked by relevance to the reader profile, then information density, then authority.

    Respond with ONLY a JSON object (no markdown fences, no commentary):
    {"links": [
      {"url": "https://...", "title": "descriptive title", "type": "blog|youtube|github|arxiv", "reason": "why this is worth reading"}
    ]}
    Use type "arxiv" for arxiv.org / ar5iv URLs, "blog" for all other web content.

  act: |
    You are a task generator. Given an article the user just read and a target project, produce a single actionable coding task applying an insight from the article to the project — or decide the article has nothing actionable here.

    ## Article

    Title: {{ title }}
    Source: {{ url }}

    {{ summary }}

    {{ content }}

    ## Target Project

    Name: {{ project_name }}
    {{ project_preamble }}
    {% if user_prompt %}

    ## User Direction

    {{ user_prompt }}
    {% endif %}

    Produce exactly one task, or skip. The title is a concrete imperative; the description says what to do, why (citing the article insight), and includes the source URL. No "investigate"/"look into" tasks — it must be implementable by a coding agent without further clarification. If the user gave direction, focus on that angle.

    ## Output

    Respond with ONLY a JSON object (no markdown fences, no commentary):
    - If actionable: {"title": "imperative task title (max 120 chars)", "description": "markdown description with what/why/source"}
    - If not actionable: {"skip": true, "reason": "one sentence why this article doesn't apply"}
