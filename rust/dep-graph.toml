# Allowed dependency edges between Mando crates.
# Enforced by structural CI test.
# Edges aggregate all Cargo dependency kinds: normal, build, dev, optional, renamed, and target-specific.
# Any edge not listed here is illegal.

[edges]
# Global crates
agent-runtime-core = ["api-types", "global-infra", "global-types"]
global-types = ["global-infra"]
global-infra = []
global-db = ["global-infra", "global-types"]
global-bus = ["api-types"]
global-claude = ["agent-runtime-core", "api-types", "global-types", "global-infra"]
global-codex-app-server = ["agent-runtime-core", "global-types", "global-infra"]
global-net = ["global-infra"]
global-git = ["global-types", "global-infra"]
global-github = ["global-infra"]
global-opencode = ["agent-runtime-core", "api-types", "global-types"]

# API contract
api-types = ["global-types"]
api-types-codegen = ["api-types", "mando-gateway"]

# Gateway client (typed consumer for the daemon API — shared SSE helper)
gateway-client = ["api-types", "global-net"]

# Domains
captain = [
    "agent-runtime-core", "api-types", "global-types", "global-db", "global-claude",
    "global-codex-app-server", "global-opencode",
    "global-bus", "global-infra", "global-git", "global-github",
    "sessions-db", "settings",
]
scout = [
    "api-types", "global-types", "global-db", "global-net",
    "global-claude", "global-infra", "global-bus",
    "sessions", "settings",
]
sessions = [
    "api-types", "global-types", "global-db",
    "global-infra", "global-claude",
    "sessions-db",
]
sessions-db = [
    "global-types", "global-db",
]
settings = [
    "api-types", "global-types", "global-db", "global-claude",
    "global-infra", "global-net", "global-git", "global-bus",
]


# Transports
transport-http = [
    "api-types", "captain", "global-bus", "global-claude", "global-github",
    "global-types", "global-infra", "scout", "sessions", "settings",
    "transport-tg", "transport-ui"
]
transport-tg = [
    "api-types", "gateway-client",
    "global-types", "global-infra", "global-net",
    "settings",
]
transport-ui = []

# Daemon binary (wires everything: domains + transports + globals)
mando-gateway = [
    "api-types",
    "global-types", "global-infra", "global-claude",
    "global-bus", "global-db",
    "captain", "scout", "sessions", "settings",
    "transport-http", "transport-tg", "transport-ui",
]

# CLI client (peer to Electron, HTTP-only)
mando-cli = ["api-types", "gateway-client", "global-types", "global-infra", "global-git"]

# Dev mocks (standalone, zero Mando deps)
dev-cc-mock = []
dev-tg-mock = []
